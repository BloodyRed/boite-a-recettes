<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon livre de recettes</title>
<meta name="theme-color" content="#2F3A31">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recettes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
html,body{margin:0;background:#2F3A31;-webkit-tap-highlight-color:transparent}
#app{min-height:100vh}
#erreur{display:none;position:fixed;inset:0;padding:20px;background:#F7F3EA;color:#A33A2E;font:14px/1.5 monospace;white-space:pre-wrap;overflow:auto;z-index:99}
@supports not (aspect-ratio: 1) { .lr .lr-livre { height: 70vh; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="erreur"></div>

</script>

@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Nunito+Sans:wght@400;600;700&family=Caveat:wght@500;600&display=swap');
.lr {
  --table: #2F3A31;
  --table-2: #26302A;
  --page: #F7F3EA;
  --page-ombre: #E8E1D3;
  --encre: #23261F;
  --encre-2: #5E6357;
  --ligne: #D8D2C3;
  --safran: #D9A21B;
  --prune: #6C3C58;
  --prune-clair: #F1E6EC;
  --vert: #3F6B4F;
  --rouge: #A33A2E;
  --ui: 'Nunito Sans', system-ui, sans-serif;
  --titre: 'Fraunces', Georgia, serif;
  --main: 'Caveat', 'Segoe Print', cursive;
  font-family: var(--ui); color: var(--encre); background: var(--table);
  min-height: 100vh; display: flex; flex-direction: column;
  background-image: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.06), transparent 60%);
}
.lr *, .lr *::before, .lr *::after { box-sizing: border-box; }
.lr button { font-family: inherit; cursor: pointer; }
.lr button:focus-visible, .lr input:focus-visible, .lr select:focus-visible, .lr textarea:focus-visible { outline: 3px solid var(--safran); outline-offset: 2px; }

/* Barre du haut */
.lr-haut { display: flex; align-items: center; gap: 12px; padding: 14px 18px; color: var(--page); flex-wrap: wrap; }
.lr-marque { display: flex; align-items: center; gap: 10px; font-family: var(--titre); font-size: 22px; font-weight: 500; margin-right: auto; letter-spacing: -.01em; }
.lr-marque small { font-family: var(--ui); font-size: 13px; opacity: .7; font-weight: 400; }
.lr-btn { display: inline-flex; align-items: center; gap: 7px; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.08); color: inherit; font-size: 14px; font-weight: 600; transition: background .18s, transform .18s; }
.lr-btn:hover { background: rgba(255,255,255,.16); }
.lr-btn:active { transform: scale(.98); }
.lr-btn.plein { background: var(--safran); color: var(--encre); border-color: transparent; }
.lr-btn.plein:hover { background: #E6B12A; }
.lr-btn.actif { background: var(--page); color: var(--encre); border-color: transparent; }
.lr-btn.icone { padding: 0; width: 44px; justify-content: center; }
.lr-btn:disabled { opacity: .4; cursor: default; }

/* Filtres */
.lr-filtres { display: flex; gap: 10px; padding: 0 18px 14px; flex-wrap: wrap; align-items: center; }
.lr-champ { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.16); border-radius: 10px; padding: 0 12px; min-height: 44px; color: var(--page); }
.lr-champ input, .lr-champ select { background: transparent; border: 0; color: inherit; font-family: inherit; font-size: 15px; min-width: 0; height: 42px; }
.lr-champ input::placeholder { color: rgba(255,255,255,.55); }
.lr-champ select option { color: var(--encre); }
.lr-champ.large { flex: 1 1 220px; }
.lr-puce { min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.2); background: transparent; color: var(--page); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; transition: background .18s; }
.lr-puce:hover { background: rgba(255,255,255,.12); }
.lr-puce.actif { background: var(--page); color: var(--encre); border-color: transparent; }
.lr-compte { color: rgba(255,255,255,.65); font-size: 13px; margin-left: auto; }

/* Grille */
.lr-grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; padding: 4px 18px 28px; }
.lr-carte { background: var(--page); border-radius: 6px 12px 12px 6px; overflow: hidden; text-align: left; border: 0; padding: 0; display: flex; flex-direction: column; box-shadow: 0 6px 18px rgba(0,0,0,.28), inset 3px 0 0 var(--page-ombre); transition: transform .2s, box-shadow .2s; position: relative; color: var(--encre); }
.lr-carte:hover { transform: translateY(-3px); box-shadow: 0 12px 26px rgba(0,0,0,.34), inset 3px 0 0 var(--page-ombre); }
.lr-carte-img { aspect-ratio: 4/3; background: var(--page-ombre); display: grid; place-items: center; overflow: hidden; color: var(--encre-2); }
.lr-carte-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.lr-carte-corps { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; }
.lr-carte-titre { font-family: var(--titre); font-size: 17px; font-weight: 500; line-height: 1.25; }
.lr-carte-meta { font-size: 12.5px; color: var(--encre-2); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.lr-coeur { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 50%; background: rgba(247,243,234,.92); display: grid; place-items: center; color: var(--rouge); }

/* \xC9toiles */
.lr-etoiles { display: inline-flex; gap: 2px; }
.lr-etoiles button { background: none; border: 0; padding: 4px; color: #CFC7B4; line-height: 0; transition: transform .12s, color .12s; }
.lr-etoiles button.on { color: var(--safran); }
.lr-etoiles button:hover { transform: scale(1.15); }
.lr-etoiles.petit span { padding: 1px; line-height: 0; color: #CFC7B4; display: inline-flex; } .lr-etoiles.petit span.on { color: var(--safran); }

/* Livre */
.lr-scene { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 6px 12px 22px; }
.lr-livre-nav { display: flex; align-items: center; gap: 12px; color: var(--page); margin-bottom: 10px; font-size: 14px; }
.lr-livre { position: relative; width: min(1180px, 100%); aspect-ratio: 3/2; perspective: 2600px; }
.lr-planche { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; border-radius: 8px; box-shadow: 0 30px 60px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.4); background: var(--table-2); }
.lr-planche::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-1px); background: linear-gradient(90deg, rgba(0,0,0,.35), rgba(0,0,0,.05)); pointer-events: none; z-index: 3; }
.lr-page { position: relative; background: var(--page); overflow: hidden; display: flex; flex-direction: column; }
.lr-page.gauche { border-radius: 8px 0 0 8px; box-shadow: inset -22px 0 30px -24px rgba(0,0,0,.35); }
.lr-page.droite { border-radius: 0 8px 8px 0; box-shadow: inset 22px 0 30px -24px rgba(0,0,0,.35); }
.lr-feuille { position: absolute; top: 0; bottom: 0; width: 50%; transform-style: preserve-3d; z-index: 5; }
.lr-feuille.avant { right: 0; transform-origin: left center; animation: tourneAvant .75s cubic-bezier(.45,.05,.35,1) forwards; }
.lr-feuille.arriere { left: 0; transform-origin: right center; animation: tourneArriere .75s cubic-bezier(.45,.05,.35,1) forwards; }
.lr-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
.lr-face.dos { transform: rotateY(180deg); }
.lr-face .lr-page { position: absolute; inset: 0; }
@keyframes tourneAvant { 0% { transform: rotateY(0); } 100% { transform: rotateY(-180deg); } }
@keyframes tourneArriere { 0% { transform: rotateY(0); } 100% { transform: rotateY(180deg); } }
@media (prefers-reduced-motion: reduce) { .lr-feuille.avant, .lr-feuille.arriere { animation-duration: .01s; } .lr-carte, .lr-btn { transition: none; } }

.lr-numero { position: absolute; bottom: 10px; font-size: 12px; color: var(--encre-2); font-family: var(--titre); }
.lr-page.gauche .lr-numero { left: 16px; } .lr-page.droite .lr-numero { right: 16px; }

/* Page photo */
.lr-photo { flex: 1; display: grid; place-items: center; padding: 22px; min-height: 0; }
.lr-photo img { max-width: 100%; max-height: 100%; object-fit: contain; box-shadow: 0 4px 14px rgba(0,0,0,.2); border-radius: 3px; cursor: zoom-in; }
.lr-photo-vide { color: var(--encre-2); text-align: center; font-size: 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.lr-vignettes { display: flex; gap: 6px; padding: 0 18px 18px; justify-content: center; }
.lr-vignettes button { width: 40px; height: 40px; border-radius: 6px; border: 2px solid transparent; padding: 0; overflow: hidden; background: var(--page-ombre); }
.lr-vignettes button.on { border-color: var(--safran); }
.lr-vignettes img { width: 100%; height: 100%; object-fit: cover; }

/* Page fiche */
.lr-fiche { flex: 1; padding: 30px 32px 34px; display: flex; flex-direction: column; gap: 14px; overflow: auto; min-height: 0; }
.lr-fiche h2 { font-family: var(--titre); font-size: clamp(22px, 2.6vw, 34px); font-weight: 500; margin: 0; line-height: 1.12; letter-spacing: -.015em; }
.lr-cat { font-size: 13px; color: var(--prune); font-weight: 700; }
.lr-fiche-ligne { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; color: var(--encre-2); }
.lr-fiche-ligne span { display: inline-flex; align-items: center; gap: 6px; }
.lr-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.lr-tag { background: var(--prune-clair); color: var(--prune); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; font-weight: 600; }
.lr-notes { font-family: var(--main); font-size: 21px; line-height: 1.35; color: #3B3F35; white-space: pre-wrap; background: repeating-linear-gradient(transparent 0 27px, var(--ligne) 27px 28px); padding: 2px 0 0; }
.lr-fiche-actions { margin-top: auto; display: flex; gap: 8px; flex-wrap: wrap; padding-top: 10px; border-top: 1px solid var(--ligne); }
.lr-btn.papier { background: transparent; color: var(--encre); border-color: var(--ligne); }
.lr-btn.papier:hover { background: var(--page-ombre); }
.lr-btn.papier.on { background: var(--prune); color: var(--page); border-color: transparent; }
.lr-cuisine { font-size: 13px; color: var(--encre-2); }

/* Sommaire */
.lr-sommaire { flex: 1; padding: 30px 32px; overflow: auto; }
.lr-sommaire h2 { font-family: var(--titre); font-size: 26px; font-weight: 500; margin: 0 0 14px; }
.lr-sommaire ol { list-style: none; margin: 0; padding: 0; }
.lr-sommaire li button { width: 100%; display: flex; gap: 8px; align-items: baseline; background: none; border: 0; padding: 7px 0; font-size: 15px; color: var(--encre); text-align: left; border-bottom: 1px dotted var(--ligne); }
.lr-sommaire li button:hover { color: var(--prune); }
.lr-sommaire li button i { flex: 1; }
.lr-sommaire li button b { font-family: var(--titre); font-weight: 500; color: var(--encre-2); }
.lr-couverture { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 30px; gap: 12px; }
.lr-couverture h1 { font-family: var(--titre); font-size: clamp(30px, 4vw, 54px); font-weight: 400; margin: 0; line-height: 1.05; letter-spacing: -.02em; }
.lr-couverture p { font-family: var(--main); font-size: 24px; color: var(--encre-2); margin: 0; }
.lr-couverture .lr-filet { width: 60px; height: 2px; background: var(--safran); }

/* Vide */
.lr-vide { color: var(--page); text-align: center; padding: 60px 20px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.lr-vide h2 { font-family: var(--titre); font-weight: 400; font-size: 30px; margin: 0; }
.lr-vide p { opacity: .75; max-width: 46ch; margin: 0; line-height: 1.5; }

/* Modales */
.lr-voile { position: fixed; inset: 0; background: rgba(20,25,20,.72); display: grid; place-items: center; padding: 14px; z-index: 50; }
.lr-modale { background: var(--page); border-radius: 14px; width: min(760px, 100%); max-height: calc(100vh - 28px); overflow: auto; padding: 22px; box-shadow: 0 30px 70px rgba(0,0,0,.5); }
.lr-modale h3 { font-family: var(--titre); font-weight: 500; font-size: 24px; margin: 0 0 16px; }
.lr-form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.lr-form .plein-large { grid-column: 1 / -1; }
.lr-form label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 700; color: var(--encre-2); }
.lr-form input, .lr-form select, .lr-form textarea { font-family: var(--ui); font-size: 15px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--ligne); background: #fff; color: var(--encre); min-height: 44px; }
.lr-form textarea { min-height: 96px; resize: vertical; font-family: var(--main); font-size: 20px; }
.lr-depot { border: 2px dashed var(--ligne); border-radius: 10px; padding: 18px; text-align: center; color: var(--encre-2); font-size: 14px; display: flex; flex-direction: column; gap: 8px; align-items: center; transition: border-color .18s, background .18s; }
.lr-depot.sur { border-color: var(--safran); background: #FBF6E4; }
.lr-depot input { font-family: var(--ui); font-size: 14px; max-width: 100%; }
.lr-collage { width: 100%; margin-top: 8px; min-height: 44px !important; height: 44px; resize: none !important; font-family: var(--ui) !important; font-size: 14px !important; color: var(--encre-2); }
.lr-apercus { display: flex; gap: 10px; flex-wrap: wrap; }
.lr-apercu { position: relative; width: 96px; height: 96px; border-radius: 8px; overflow: hidden; background: var(--page-ombre); }
.lr-apercu img { width: 100%; height: 100%; object-fit: cover; }
.lr-apercu button { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(35,38,31,.85); color: #fff; display: grid; place-items: center; }
.lr-modale-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
.lr-btn.sombre { background: var(--encre); color: var(--page); border-color: transparent; }
.lr-btn.sombre:hover { background: #3A3E33; }
.lr-btn.danger { background: transparent; color: var(--rouge); border-color: transparent; margin-right: auto; }
.lr-btn.danger:hover { background: #F6E3E0; }
.lr-erreur { color: var(--rouge); font-size: 13px; }

/* Zoom */
.lr-zoom { position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 60; overflow: auto; display: grid; place-items: center; cursor: zoom-out; }
.lr-zoom img { max-width: 100%; max-height: 100vh; object-fit: contain; }
.lr-zoom img.grand { max-width: none; max-height: none; width: 180vw; cursor: zoom-in; }
.lr-zoom-fermer { position: fixed; top: 14px; right: 14px; }

/* Toast */
.lr-toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--page); color: var(--encre); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.4); z-index: 70; }

/* Mobile : livre en une seule page */
@media (max-width: 760px) {
  .lr-livre { aspect-ratio: auto; height: calc(100vh - 210px); min-height: 460px; }
  .lr-planche { grid-template-columns: 1fr; }
  .lr-planche::after { display: none; }
  .lr-page.gauche { border-radius: 8px; box-shadow: none; }
  .lr-page.droite { display: none; }
  .lr-page.gauche .lr-numero { display: none; }
  .lr-page.mobile-simple { border-radius: 8px; overflow: auto; }
  .lr-page.mobile-simple .lr-photo { flex: 0 0 auto; min-height: 240px; }
  .lr-page.mobile-simple .lr-fiche { flex: 0 0 auto; overflow: visible; padding-top: 6px; }
  .lr-feuille { width: 100%; }
  .lr-form { grid-template-columns: 1fr; }
  .lr-marque small { display: none; }
}
