<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon livre de recettes</title>
<meta name="version" content="1.13">
<meta name="theme-color" content="#1F2A2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recettes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">

<style>

</style>
</head>

<div id="app"></div>
<div id="erreur"></div>

</script>

@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap');
.lr {
  --table: #1F2A2E;
  --table-2: #182124;
  --page: #E9DCC5;
  --page-ombre: #DCCDB2;
  --encre: #2A241A;
  --encre-2: #6E6250;
  --ligne: #CDBE9F;
  --safran: #F7E39B;
  --prune: #86384F;
  --prune-clair: #F4B6C2;
  --craie: #F3EEE4;
  --craie-2: #9FB0B2;
  --craie-ligne: rgba(255,255,255,.22);
  --craie-fond: rgba(255,255,255,.07);
  --vert: #3F6B4F;
  --rouge: #A33A2E;
  --ui: 'Work Sans', system-ui, sans-serif;
  --titre: 'Caveat', 'Segoe Print', cursive;
  --main: 'Caveat', 'Segoe Print', cursive;
  font-family: var(--ui); color: var(--encre); background: var(--table);
  min-height: 100vh; display: flex; flex-direction: column; padding-bottom: calc(84px + env(safe-area-inset-bottom));
  background-image: repeating-linear-gradient(0deg, transparent 0 2px, rgba(255,255,255,.012) 2px 3px);
}
.lr *, .lr *::before, .lr *::after { box-sizing: border-box; }
.lr-haut, .lr-filtres, .lr-grille, .lr-planning, .lr-scene, .lr-vide { width: 100%; max-width: 950px; margin-left: auto; margin-right: auto; }
.lr button { font-family: inherit; cursor: pointer; }
.lr button:focus-visible, .lr input:focus-visible, .lr select:focus-visible, .lr textarea:focus-visible { outline: 3px solid var(--safran); outline-offset: 2px; }

/* Barre du haut */
.lr-haut { display: flex; align-items: center; gap: 12px; padding: 16px 18px 6px; color: var(--craie); flex-wrap: wrap; }
.lr-marque { display: flex; align-items: center; gap: 10px; font-family: var(--titre); font-size: 34px; font-weight: 600; margin-right: auto; color: var(--safran); line-height: 1; }
.lr-marque small { font-family: var(--ui); font-size: 11px; color: var(--craie-2); font-weight: 500; letter-spacing: .1em; text-transform: uppercase; margin-top: 4px; }
.lr-btn { display: inline-flex; align-items: center; gap: 7px; min-height: 44px; padding: 0 14px; border-radius: 6px; border: 1.5px dashed var(--craie-ligne); background: transparent; color: inherit; font-size: 14px; font-weight: 500; transition: background .18s, transform .18s; }
.lr-btn:hover { background: var(--craie-fond); border-style: solid; }
.lr-btn:active { transform: scale(.98); }
.lr-btn.plein { background: var(--safran); color: #2A241A; border: 1.5px solid var(--safran); }
.lr-btn.plein:hover { filter: brightness(1.05); }
.lr-btn.actif { background: var(--craie); color: #2A241A; border: 1.5px solid var(--craie); }
.lr-btn.icone { padding: 0; width: 44px; justify-content: center; }
.lr-btn:disabled { opacity: .4; cursor: default; }
.lr-btn.icone.petit { width: 38px; min-height: 38px; border-radius: 6px; }

/* Barre du bas */
.lr-bas { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: grid; grid-template-columns: 1fr 1fr auto 1fr 1fr; align-items: end; gap: 2px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); background: var(--table-2); border-top: 1.5px dashed var(--craie-ligne); box-shadow: 0 -8px 24px rgba(0,0,0,.25); }
.lr-bas > button { min-height: 60px; border: 0; border-radius: 6px; background: transparent; color: var(--craie-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 6px 2px; transition: background .18s, color .18s; }
.lr-bas > button:hover { background: var(--craie-fond); }
.lr-bas > button.on { color: var(--safran); }
.lr-bas > button.lr-bas-plus { width: 68px; height: 68px; min-height: 68px; border-radius: 50%; background: var(--safran); color: #2A241A; margin: 0 6px -8px; box-shadow: 0 8px 20px rgba(0,0,0,.35); align-self: center; }
.lr-bas > button.lr-bas-plus:hover { filter: brightness(1.05); }
@media (min-width: 761px) { .lr-bas { left: 50%; right: auto; transform: translateX(-50%); width: min(640px, 100%); border-radius: 8px 8px 0 0; border: 1.5px dashed var(--craie-ligne); border-bottom: 0; } }

/* Planning */
.lr-planning { padding: 4px 18px 28px; color: var(--craie); display: flex; flex-direction: column; gap: 14px; }
.lr-planning-nav { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.lr-planning-nav h2 { font-family: var(--titre); font-weight: 600; font-size: 32px; margin: 0; flex: 1; color: var(--safran); line-height: 1; }
.lr-planning-nav h2 small { display: block; font-family: var(--ui); font-size: 11px; color: var(--craie-2); font-weight: 500; letter-spacing: .1em; text-transform: uppercase; margin-top: 4px; }
.lr-semaine { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.lr-jour { background: var(--page); color: var(--encre); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-height: 130px; box-shadow: 0 6px 18px rgba(0,0,0,.22); }
.lr-jour.auj { outline: 2px dashed var(--safran); outline-offset: 3px; }
.lr-jour header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--ligne); padding-bottom: 6px; }
.lr-jour header b { font-family: var(--titre); font-weight: 600; font-size: 24px; }
.lr-jour header span { font-size: 13px; color: var(--encre-2); }
.lr-jour header .auj-badge { color: var(--prune); font-weight: 700; font-size: 12px; }
.lr-plan-item { display: flex; align-items: center; gap: 6px; }
.lr-plan-rec { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--page-ombre); border: 0; border-radius: 8px; padding: 6px 8px 6px 6px; min-height: 48px; text-align: left; color: var(--encre); font-size: 14px; font-weight: 600; }
.lr-plan-rec:hover { background: var(--prune-clair); }
.lr-plan-rec img, .lr-plan-rec .vide { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; background: var(--ligne); flex: none; display: grid; place-items: center; color: var(--encre-2); }
.lr-plan-item > button { width: 40px; min-height: 48px; border: 0; background: transparent; color: var(--encre-2); border-radius: 8px; }
.lr-plan-item > button:hover { background: #F6E3E0; color: var(--rouge); }
.lr-plan-ajout { margin-top: auto; min-height: 44px; border: 1px dashed var(--ligne); background: transparent; border-radius: 8px; color: var(--encre-2); font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.lr-plan-ajout:hover { background: var(--page-ombre); color: var(--encre); }
.lr-plan-resume { color: var(--craie-2); font-size: 13px; }

/* Choix (recette / date) */
.lr-liste-choix { display: flex; flex-direction: column; gap: 6px; max-height: 55vh; overflow: auto; }
.lr-liste-choix button { display: flex; align-items: center; gap: 10px; min-height: 52px; border: 1px solid var(--ligne); background: #fff; border-radius: 10px; padding: 6px 12px 6px 6px; text-align: left; color: var(--encre); font-size: 15px; font-weight: 600; }
.lr-liste-choix button:hover { background: var(--prune-clair); border-color: var(--prune); }
.lr-liste-choix button img, .lr-liste-choix button .vide { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; background: var(--page-ombre); flex: none; }
.lr-liste-choix button small { color: var(--encre-2); font-weight: 400; margin-left: auto; font-size: 13px; }
.lr-liste-choix button.auj { border-color: var(--safran); }

/* R\xE9glages */
.lr-reglages { padding: 4px 18px 28px; display: flex; flex-direction: column; gap: 16px; max-width: 760px; width: 100%; margin: 0 auto; }
.lr-reglages section { background: var(--page); color: var(--encre); border-radius: 6px; padding: 18px; box-shadow: 0 6px 18px rgba(0,0,0,.22); }
.lr-reglages h3 { font-family: var(--titre); font-weight: 600; font-size: 30px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
.lr-reglages p { margin: 0 0 10px; font-size: 14px; color: var(--encre-2); line-height: 1.5; }
.lr-themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.lr-theme { border: 3px solid transparent; border-radius: 6px; padding: 10px; min-height: 80px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; color: #fff; font-weight: 700; font-size: 13px; position: relative; }
.lr-theme.on { border-color: var(--safran); }
.lr-theme .pastilles { display: flex; gap: 4px; }
.lr-theme .pastilles span { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255,255,255,.7); }
.lr-theme .coche { position: absolute; top: 8px; right: 8px; }
.lr-perso { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 12px; }
.lr-perso label { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; min-height: 44px; }
.lr-perso input[type=color] { width: 44px; height: 44px; border: 1px solid var(--ligne); border-radius: 8px; padding: 2px; background: #fff; }
.lr-reglages .lr-btn.papier { min-height: 48px; }
.lr-apropos { font-size: 14px; color: var(--encre-2); line-height: 1.7; }
.lr-cats { display: flex; flex-direction: column; gap: 8px; }
.lr-cat-ligne { display: grid; grid-template-columns: auto 1fr auto auto auto auto; gap: 6px; align-items: center; }
.lr-cat-ligne.ajout { grid-template-columns: 1fr auto; margin-top: 6px; }
.lr-cat-ligne input, .lr-cat-ligne select { font-family: var(--ui); font-size: 14px; padding: 8px 10px; border-radius: 4px; border: 1px solid var(--ligne); background: rgba(255,255,255,.55); color: var(--encre); min-height: 44px; min-width: 0; }
.lr-cat-pastille { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 4px 9px; border-radius: 3px; transform: rotate(-2deg); max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lr-cat-nom { text-align: left; background: none; border: 1.5px dashed transparent; border-radius: 4px; padding: 8px 10px; min-height: 44px; font-family: var(--ui); font-size: 15px; color: var(--encre); }
.lr-cat-nom:hover { border-color: var(--ligne); }
.lr-cat-nom small { color: var(--encre-2); font-size: 12px; margin-left: 6px; }
.lr-cat-ligne .lr-btn.icone { width: 40px; min-height: 40px; }
@media (max-width: 600px) { .lr-cat-ligne { grid-template-columns: 1fr auto auto auto; } .lr-cat-pastille { grid-column: 1 / -1; justify-self: start; } .lr-cat-ligne > select { grid-column: 1 / -1; } }

/* Filtres */
.lr-filtres { display: flex; gap: 10px; padding: 0 18px 14px; flex-wrap: wrap; align-items: center; }
.lr-champ { display: flex; align-items: center; gap: 8px; background: var(--craie-fond); border: 1.5px dashed var(--craie-ligne); border-radius: 6px; padding: 0 12px; min-height: 44px; color: var(--craie); }
.lr-champ input, .lr-champ select { background: transparent; border: 0; color: inherit; font-family: inherit; font-size: 15px; min-width: 0; height: 42px; }
.lr-champ input::placeholder { color: var(--craie-2); }
.lr-champ select option { color: var(--encre); }
.lr-champ.large { flex: 1 1 220px; }
.lr-puce { min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1.5px dashed var(--craie-ligne); background: transparent; color: var(--craie); font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; transition: background .18s; }
.lr-puce:hover { background: var(--craie-fond); }
.lr-puce.actif { background: var(--safran); color: #2A241A; border: 1.5px solid var(--safran); }
.lr-compte { color: var(--craie-2); font-size: 12px; margin-left: auto; letter-spacing: .08em; text-transform: uppercase; }

/* Grille */
.lr-grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; padding: 4px 18px 28px; }
.lr-carte { background: var(--page); border-radius: 6px; overflow: visible; text-align: left; border: 0; padding: 8px 8px 10px; display: flex; flex-direction: column; box-shadow: 0 6px 18px rgba(0,0,0,.28); transition: transform .2s, box-shadow .2s; position: relative; color: var(--encre); }
.lr-carte:hover { transform: translateY(-3px) rotate(-.4deg); box-shadow: 0 12px 26px rgba(0,0,0,.34); }
.lr-carte-img { aspect-ratio: 4/3; background: var(--page-ombre); display: grid; place-items: center; overflow: hidden; color: var(--encre-2); border-radius: 3px; }
.lr-carte-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.lr-carte-corps { padding: 10px 4px 2px; display: flex; flex-direction: column; gap: 4px; }
.lr-carte-titre { font-family: var(--titre); font-size: 23px; font-weight: 600; line-height: 1.05; }
.lr-carte-meta { font-size: 11.5px; color: var(--encre-2); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.lr-coeur { position: absolute; top: 14px; left: 14px; width: 30px; height: 30px; border-radius: 50%; background: rgba(233,220,197,.92); display: grid; place-items: center; color: var(--rouge); }
.lr-ruban { position: absolute; top: -8px; right: 10px; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 4px 9px; border-radius: 3px; transform: rotate(2deg); box-shadow: 0 2px 4px rgba(0,0,0,.2); }

/* \xC9toiles */
.lr-etoiles { display: inline-flex; gap: 2px; }
.lr-etoiles button { background: none; border: 0; padding: 4px; color: #CFC7B4; line-height: 0; transition: transform .12s, color .12s; }
.lr-etoiles button.on { color: var(--safran); }
.lr-etoiles button:hover { transform: scale(1.15); }
.lr-etoiles.petit span { padding: 1px; line-height: 0; color: #CFC7B4; display: inline-flex; } .lr-etoiles.petit span.on { color: var(--safran); }

/* Livre */
.lr-scene { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 6px 12px 22px; }
.lr-livre-nav { display: flex; align-items: center; gap: 10px; color: var(--craie); margin-bottom: 10px; font-size: 14px; width: min(950px, 100%); flex-wrap: wrap; }
.lr-livre-pos { min-width: 70px; text-align: center; font-variant-numeric: tabular-nums; }
.lr-recherche-livre { position: relative; flex: 1 1 220px; margin-right: auto; max-width: 420px; order: -1; }
.lr-recherche-livre .lr-champ { width: 100%; }
.lr-recherche-livre input { flex: 1; }
.lr-effacer { background: none; border: 0; color: inherit; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; }
.lr-effacer:hover { background: rgba(255,255,255,.15); }
.lr-resultats { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--page); color: var(--encre); border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.4); padding: 6px; z-index: 30; display: flex; flex-direction: column; gap: 2px; max-height: 50vh; overflow: auto; }
.lr-resultats button { display: flex; align-items: center; gap: 10px; min-height: 48px; border: 0; background: transparent; border-radius: 8px; padding: 4px 10px 4px 4px; text-align: left; color: var(--encre); font-size: 15px; font-weight: 600; }
.lr-resultats button:hover, .lr-resultats button:focus-visible { background: var(--prune-clair); }
.lr-resultats button img, .lr-resultats button .vide { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; background: var(--page-ombre); flex: none; display: grid; place-items: center; color: var(--encre-2); }
.lr-resultats button small { margin-left: auto; color: var(--encre-2); font-weight: 400; font-size: 13px; }
.lr-resultats p { margin: 0; padding: 12px; color: var(--encre-2); font-size: 14px; }

/* Pellicule d'aper\xE7us */
.lr-pellicule { display: flex; gap: 8px; overflow-x: auto; width: min(950px, 100%); padding: 14px 4px 6px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.25) transparent; scroll-snap-type: x proximity; }
.lr-pellicule button { flex: none; width: 64px; height: 64px; border-radius: 8px; border: 3px solid transparent; padding: 0; overflow: hidden; background: var(--page-ombre); opacity: .55; transition: opacity .2s, transform .2s, border-color .2s; scroll-snap-align: center; display: grid; place-items: center; color: var(--encre-2); }
.lr-pellicule button:hover { opacity: .9; }
.lr-pellicule button.on { opacity: 1; border-color: var(--safran); transform: scale(1.1) rotate(-2deg); }
.lr-pellicule button.couv { background: var(--page); }
.lr-pellicule img { width: 100%; height: 100%; object-fit: cover; display: block; }
.lr-livre { position: relative; width: min(950px, 100%); aspect-ratio: 3/2; perspective: 2600px; }
.lr-planche { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; border-radius: 4px; box-shadow: 0 30px 60px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.4); background: var(--table-2); }
.lr-planche::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-1px); background: linear-gradient(90deg, rgba(0,0,0,.35), rgba(0,0,0,.05)); pointer-events: none; z-index: 3; }
.lr-page { position: relative; background: var(--page); overflow: hidden; display: flex; flex-direction: column; }
.lr-page.gauche { border-radius: 8px 0 0 8px; box-shadow: inset -22px 0 30px -24px rgba(0,0,0,.35); }
.lr-page.droite { border-radius: 0 8px 8px 0; box-shadow: inset 22px 0 30px -24px rgba(0,0,0,.35); }
.lr-feuille { position: absolute; top: 0; bottom: 0; width: 50%; transform-style: preserve-3d; z-index: 5; }
.lr-feuille.avant { right: 0; transform-origin: left center; animation: tourneAvant .75s cubic-bezier(.45,.05,.35,1) forwards; }
.lr-feuille.arriere { left: 0; transform-origin: right center; animation: tourneArriere .75s cubic-bezier(.45,.05,.35,1) forwards; }
.lr-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
.lr-face.dos { transform: rotateY(180deg); }
.lr-face .lr-page { position: absolute; inset: 0; }
@keyframes tourneAvant { 0% { transform: rotateY(0); } 100% { transform: rotateY(-180deg); } }
@keyframes tourneArriere { 0% { transform: rotateY(0); } 100% { transform: rotateY(180deg); } }
@media (prefers-reduced-motion: reduce) { .lr-feuille.avant, .lr-feuille.arriere { animation-duration: .01s; } .lr-carte, .lr-btn { transition: none; } }

.lr-bord { position: absolute; top: 0; bottom: 0; width: 25%; pointer-events: none; z-index: 4; display: flex; align-items: center; color: var(--encre-2); opacity: 0; transition: opacity .25s; }
.lr-bord.gauche { left: 0; justify-content: flex-start; padding-left: 10px; background: linear-gradient(90deg, rgba(0,0,0,.10), transparent 40%); }
.lr-bord.droite { right: 0; justify-content: flex-end; padding-right: 10px; background: linear-gradient(-90deg, rgba(0,0,0,.10), transparent 40%); }
.lr-planche:hover .lr-bord { opacity: .9; }
.lr-planche { cursor: default; }
.lr-page { cursor: pointer; }
.lr-page .lr-fiche, .lr-page .lr-sommaire, .lr-page .lr-couverture { cursor: auto; }
.lr-numero { position: absolute; bottom: 8px; font-size: 16px; color: var(--encre-2); font-family: var(--titre); }
.lr-page.gauche .lr-numero { left: 16px; } .lr-page.droite .lr-numero { right: 16px; }

/* Page photo */
.lr-photo { flex: 1; display: grid; place-items: center; padding: 22px; min-height: 0; }
.lr-photo img { max-width: 100%; max-height: 100%; object-fit: contain; box-shadow: 0 4px 14px rgba(0,0,0,.2); border-radius: 3px; cursor: zoom-in; }
.lr-photo-vide { color: var(--encre-2); text-align: center; font-size: 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.lr-vignettes { display: flex; gap: 6px; padding: 0 18px 18px; justify-content: center; }
.lr-vignettes button { width: 40px; height: 40px; border-radius: 6px; border: 2px solid transparent; padding: 0; overflow: hidden; background: var(--page-ombre); }
.lr-vignettes button.on { border-color: var(--safran); }
.lr-vignettes img { width: 100%; height: 100%; object-fit: cover; }

/* Page fiche */
.lr-fiche { flex: 1; padding: 30px 32px 34px; display: flex; flex-direction: column; gap: 14px; overflow: auto; min-height: 0; }
.lr-fiche h2 { font-family: var(--titre); font-size: clamp(32px, 3.6vw, 48px); font-weight: 600; margin: 0; line-height: 1; }
.lr-cat { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; display: inline-block; padding: 3px 8px; border-radius: 3px; margin-bottom: 6px; transform: rotate(-1.5deg); }
.lr-fiche-ligne { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; color: var(--encre-2); }
.lr-fiche-ligne span { display: inline-flex; align-items: center; gap: 6px; }
.lr-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.lr-tag { background: var(--prune-clair); color: var(--prune); border-radius: 3px; padding: 3px 9px; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; }
.lr-notes { font-family: var(--main); font-size: 22px; line-height: 1.35; color: #3E3327; white-space: pre-wrap; background: repeating-linear-gradient(transparent 0 29px, var(--ligne) 29px 30px); padding: 2px 0 0; }
.lr-fiche { position: relative; }
.lr-fiche-outils { position: absolute; top: 14px; right: 14px; display: flex; gap: 6px; z-index: 2; }
.lr-fiche-outils .lr-btn.icone { width: 40px; min-height: 40px; border-radius: 10px; background: var(--page); }
.lr-fiche-tete { padding-right: 190px; }
.lr-cuisine { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--ligne); }
.lr-btn.papier { background: transparent; color: var(--encre); border: 1.5px dashed var(--ligne); }
.lr-btn.papier:hover { background: var(--page-ombre); }
.lr-btn.papier.on { background: var(--prune-clair); color: var(--prune); border: 1.5px solid var(--prune-clair); }
.lr-cuisine { font-size: 13px; color: var(--encre-2); }

/* Sommaire */
.lr-sommaire { flex: 1; padding: 30px 32px; overflow: auto; }
.lr-sommaire h2 { font-family: var(--titre); font-size: 38px; font-weight: 600; margin: 0 0 10px; }
.lr-sommaire ol { list-style: none; margin: 0; padding: 0; }
.lr-sommaire li button { width: 100%; display: flex; gap: 8px; align-items: baseline; background: none; border: 0; padding: 7px 0; font-size: 15px; color: var(--encre); text-align: left; border-bottom: 1px dotted var(--ligne); }
.lr-sommaire li button:hover { color: var(--prune); }
.lr-sommaire li button i { flex: 1; }
.lr-sommaire li button b { font-family: var(--titre); font-weight: 600; font-size: 18px; color: var(--encre-2); }
.lr-couverture { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 30px; gap: 12px; }
.lr-couverture h1 { font-family: var(--titre); font-size: clamp(44px, 6vw, 80px); font-weight: 700; margin: 0; line-height: 1; }
.lr-couverture p { font-family: var(--ui); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--encre-2); margin: 0; }
.lr-couverture .lr-filet { width: 70px; height: 0; border-top: 2px dashed var(--encre-2); }
.lr-version { font-family: var(--titre); font-size: 15px; text-transform: none; letter-spacing: 0; position: absolute; bottom: 12px; left: 0; right: 0; text-align: center; font-size: 11px; color: var(--encre-2); letter-spacing: .08em; text-transform: uppercase; }
.lr-couverture { position: relative; }

/* Vide */
.lr-vide { color: var(--craie); text-align: center; padding: 60px 20px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.lr-vide h2 { font-family: var(--titre); font-weight: 600; font-size: 44px; margin: 0; color: var(--safran); }
.lr-vide p { color: var(--craie-2); max-width: 46ch; margin: 0; line-height: 1.5; }

/* Modales */
.lr-voile { position: fixed; inset: 0; background: rgba(20,25,20,.72); display: grid; place-items: center; padding: 14px; z-index: 50; }
.lr-modale { background: var(--page); border-radius: 6px; width: min(760px, 100%); max-height: calc(100vh - 28px); overflow: auto; padding: 22px; box-shadow: 0 30px 70px rgba(0,0,0,.5); }
.lr-modale h3 { font-family: var(--titre); font-weight: 600; font-size: 36px; margin: 0 0 12px; line-height: 1; }
.lr-form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.lr-form .plein-large { grid-column: 1 / -1; }
.lr-form label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 700; color: var(--encre-2); }
.lr-form input, .lr-form select, .lr-form textarea { font-family: var(--ui); font-size: 15px; padding: 10px 12px; border-radius: 4px; border: 1px solid var(--ligne); background: rgba(255,255,255,.55); color: var(--encre); min-height: 44px; }
.lr-form textarea { min-height: 96px; resize: vertical; font-family: var(--main); font-size: 20px; }
.lr-depot { border: 2px dashed var(--ligne); border-radius: 10px; padding: 18px; text-align: center; color: var(--encre-2); font-size: 14px; display: flex; flex-direction: column; gap: 8px; align-items: center; transition: border-color .18s, background .18s; }
.lr-depot.sur { border-color: var(--safran); background: #FBF6E4; }
.lr-depot input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.lr-depot { position: relative; cursor: pointer; }
.lr-depot:hover { border-color: var(--prune); background: var(--prune-clair); }
.lr-depot small { font-size: 12px; opacity: .75; }
.lr-apercus { display: flex; gap: 10px; flex-wrap: wrap; }
.lr-apercu { position: relative; width: 96px; height: 96px; border-radius: 8px; overflow: hidden; background: var(--page-ombre); }
.lr-apercu img { width: 100%; height: 100%; object-fit: cover; }
.lr-apercu button { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(35,38,31,.85); color: #fff; display: grid; place-items: center; }
.lr-modale-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
.lr-btn.sombre { background: var(--encre); color: var(--page); border: 1.5px solid var(--encre); }
.lr-btn.sombre:hover { background: #3E3327; }
.lr-btn.danger { background: transparent; color: var(--rouge); border-color: transparent; margin-right: auto; }
.lr-btn.danger:hover { background: #F6E3E0; }
.lr-erreur { color: var(--rouge); font-size: 13px; }
.lr-lien { background: none; border: 0; padding: 0; color: var(--prune); font-weight: 700; text-decoration: underline; font-size: inherit; }
.lr-aide { margin: -6px 0 14px; font-size: 14px; color: var(--encre-2); line-height: 1.5; }
.lr-barre { height: 6px; background: var(--page-ombre); border-radius: 3px; margin-top: 10px; overflow: hidden; }
.lr-barre div { height: 100%; background: var(--safran); transition: width .2s; }
.lr-lot-tete { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin: 16px 0 10px; font-size: 14px; }
.lr-lot-tete label { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--encre-2); }
.lr-lot-tete select, .lr-lot-champs input, .lr-lot-champs select { font-family: var(--ui); font-size: 15px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--ligne); background: #fff; color: var(--encre); min-height: 44px; }
.lr-lot { display: flex; flex-direction: column; gap: 8px; max-height: 45vh; overflow: auto; padding-right: 4px; }
.lr-lot-ligne { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; background: var(--page-ombre); border-radius: 10px; padding: 8px; }
.lr-lot-images { position: relative; display: flex; }
.lr-lot-images img { width: 64px; height: 64px; object-fit: cover; border-radius: 6px; border: 2px solid var(--page); margin-left: -22px; }
.lr-lot-images img:first-child { margin-left: 0; }
.lr-lot-nb { position: absolute; bottom: -4px; right: -4px; background: var(--prune); color: #fff; font-size: 11px; font-weight: 700; border-radius: 999px; min-width: 20px; height: 20px; display: grid; place-items: center; padding: 0 5px; }
.lr-lot-champs { display: grid; grid-template-columns: 1fr auto; gap: 8px; min-width: 0; }
.lr-lot-actions { display: flex; gap: 4px; }
.lr-lot-actions .lr-btn.icone { width: 40px; min-height: 40px; }
@media (max-width: 600px) { .lr-lot-ligne { grid-template-columns: auto 1fr; } .lr-lot-champs { grid-template-columns: 1fr; } .lr-lot-actions { grid-column: 1 / -1; justify-content: flex-end; } }

/* Zoom */
.lr-zoom { position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 60; overflow: auto; display: grid; place-items: center; cursor: zoom-out; }
.lr-zoom img { max-width: 100%; max-height: 100vh; object-fit: contain; }
.lr-zoom img.grand { max-width: none; max-height: none; width: 180vw; cursor: zoom-in; }
.lr-zoom-fermer { position: fixed; top: 14px; right: 14px; }

/* Toast */
.lr-toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--page); color: var(--encre); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.4); z-index: 70; }

/* Mobile : livre en une seule page */
@media (max-width: 760px) {
  .lr-livre { aspect-ratio: auto; height: calc(100vh - 360px); min-height: 380px; }
  .lr-recherche-livre { flex-basis: 100%; max-width: none; order: -1; }
  .lr-pellicule button { width: 52px; height: 52px; }
  .lr-haut { padding: 10px 14px; gap: 8px; }
  .lr-marque { font-size: 28px; }
  .lr-planche { grid-template-columns: 1fr; }
  .lr-planche::after { display: none; }
  .lr-page.gauche { border-radius: 8px; box-shadow: none; }
  .lr-page.droite { display: none; }
  .lr-page.gauche .lr-numero { display: none; }
  .lr-page.mobile-simple { border-radius: 8px; overflow: auto; }
  .lr-page.mobile-simple .lr-photo { flex: 0 0 auto; min-height: 240px; }
  .lr-page.mobile-simple .lr-fiche { flex: 0 0 auto; overflow: visible; padding-top: 6px; }
  .lr-page.mobile-simple .lr-fiche-outils { position: static; justify-content: flex-end; margin-bottom: -6px; }
  .lr-page.mobile-simple .lr-fiche-tete { padding-right: 0; }
  .lr-feuille { width: 100%; }
  .lr-bord { width: 30%; opacity: .6; }
  .lr-form { grid-template-columns: 1fr; }
  .lr-marque small { display: none; }
}
